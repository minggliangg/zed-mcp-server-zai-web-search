name: Release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: huacnlee/zed-extension-action@v2.0.0
        with:
          extension-name: zed-mcp-server-zai-web-search
          push-to: minggliangg/extensions
        env:
          COMMITTER_TOKEN: ${{ secrets.COMMITTER_TOKEN }}
